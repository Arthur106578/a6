<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园三维导览 - 校园信息中心</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; }
    /* 悬浮返回条：不拦截3D场景的鼠标拖拽 */
    #back-bar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 9999;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 10px 16px;
      background: rgba(13, 110, 253, 0.92);
      color: #fff;
      font: 14px/1.5 "Microsoft YaHei", sans-serif;
      pointer-events: none;
    }
    #back-bar a {
      pointer-events: auto;
      color: #fff;
      text-decoration: none;
      background: rgba(255, 255, 255, 0.18);
      padding: 4px 12px;
      border-radius: 4px;
      white-space: nowrap;
    }
    #tip {
      position: fixed;
      bottom: 10px; left: 50%;
      transform: translateX(-50%);
      z-index: 9999;
      color: #fff;
      background: rgba(0, 0, 0, 0.45);
      font-size: 13px;
      padding: 4px 14px;
      border-radius: 14px;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="back-bar">
    <span>校园三维导览 · 教学楼 / 旗杆 / 路灯（课堂七场景）</span>
    <a href="../index.html">← 返回信息中心</a>
  </div>

  <a-scene>
    <!-- 环境：天空与草地 -->
    <a-sky color="#aee3f7"></a-sky>
    <a-plane
      position="0 0 -4" rotation="-90 0 0"
      width="20" height="20" color="#7cb342">
    </a-plane>

    <!-- 主体：教学楼（方盒+红屋顶） -->
    <a-box position="0 1.2 -6" width="4" height="2.4" depth="2" color="#efeeee"></a-box>
    <a-box position="0 2.7 -6" width="4.4" height="0.4" depth="2.4" color="#b71c1c"></a-box>

    <!-- 旗杆与旗帜（飘扬动画） -->
    <a-cylinder position="3 1.8 -5" radius="0.05" height="3.6" color="#9e9e9e"></a-cylinder>
    <a-box
      position="3.35 3.3 -5" width="0.7" height="0.45" depth="0.03" color="#e53935"
      animation="property: position; to: 3.4 3.3 -5; dir: alternate; dur: 900; loop: true">
    </a-box>

    <!-- 路灯：杆+发光球（缩放呼吸动画+点光源） -->
    <a-cylinder position="-3 1.2 -4" radius="0.06" height="2.4" color="#616161"></a-cylinder>
    <a-sphere position="-3 2.5 -4" radius="0.18" color="#fff59d"
              animation="property: scale; to: 1.3 1.3 1.3; dir: alternate; dur: 1200; loop: true">
    </a-sphere>
    <a-light type="point" position="-3 2.6 -4" color="#fff59d" intensity="0.6"></a-light>

    <!-- 环境光 -->
    <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>

    <!-- 相机初始位：稍远处平视校园 -->
    <a-camera position="0 1.8 2"></a-camera>
  </a-scene>

  <div id="tip">按住鼠标拖动环视 · 滚轮前进后退</div>
</body>
</html>

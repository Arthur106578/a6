<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>校园公共信息与数据展示中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <!-- 顶部导航：四个模块入口 -->
  <nav class="navbar navbar-expand-lg bg-primary" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">校园信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="mainNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="rooms.html">自习室</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">统计</a></li>
          <li class="nav-item"><a class="nav-link" href="campus3d.html">校园三维</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <!-- 欢迎区 -->
    <header class="text-center mb-4">
      <h1 class="h3">迷你版校园公共信息与数据展示中心</h1>
      <p class="text-muted">课堂成果组装：Bootstrap 页面 · 筛选交互 · 数据图表 · 三维场景</p>
    </header>

    <!-- 四模块卡片入口 -->
    <section class="row g-3">
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">首页导航</h2>
            <p class="card-text text-muted">Bootstrap 导航栏与卡片布局，串联全部模块。</p>
            <a class="btn btn-primary btn-sm" href="index.html">当前页</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">自习室查询</h2>
            <p class="card-text text-muted">按楼层与开放状态筛选，实时查看自习室列表。</p>
            <a class="btn btn-primary btn-sm" href="rooms.html">立即查询</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">使用统计</h2>
            <p class="card-text text-muted">加载 data.json，ECharts 柱状图展示使用量。</p>
            <a class="btn btn-primary btn-sm" href="stats.html">查看图表</a>
          </div>
        </div>
      </div>
      <div class="col-md-6 col-lg-3">
        <div class="card h-100">
          <div class="card-body">
            <h2 class="card-title h5">校园三维</h2>
            <p class="card-text text-muted">占位页：下一步接入 Three.js/A-Frame 地标场景。</p>
            <a class="btn btn-outline-primary btn-sm" href="campus3d.html">前往（占位）</a>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="text-center text-muted small py-3">综合作品演示 · 课堂成果组装</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>

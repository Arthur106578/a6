<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-success" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">宿舍信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link active" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link" href="dorms.html">宿舍查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">用电统计</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <header class="hero text-center mb-4">
      <h1 class="h3">宿舍信息中心</h1>
      <p class="text-muted mb-0">宿舍床位查询 · 用电量统计，一个页面全搞定</p>

          <div class="card-body text-center">
            <h2 class="h5 card-title">用电统计</h2>
            <p class="card-text text-muted">读取 JSON 数据，柱状图展示各宿舍本月用电量。</p>
            <a class="btn btn-success" href="stats.html">看统计</a>
          </div>
        </div>
      </div>

  <footer class="text-center text-muted small py-3">宿舍信息中心 · 期末整合练习原型</footer>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宿舍查询 - 宿舍信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg bg-success" data-bs-theme="dark">
    <div class="container">
      <a class="navbar-brand" href="index.html">宿舍信息中心</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">首页</a></li>
          <li class="nav-item"><a class="nav-link active" href="dorms.html">宿舍查询</a></li>
          <li class="nav-item"><a class="nav-link" href="stats.html">用电统计</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container py-4">
    <h1 class="h4 mb-3">宿舍查询</h1>

    <section class="card mb-3">
      <div class="card-body d-flex flex-wrap gap-3 align-items-end">
        <div>
          <label for="building" class="form-label">楼栋</label>
          <select id="building" class="form-select">
            <option value="all">全部楼栋</option>
            <option value="1">1 栋</option>
            <option value="2">2 栋</option>
            <option value="3">3 栋</option>
          </select>
        </div>
        <div>
          <label for="status" class="form-label">床位状态</label>
          <select id="status" class="form-select">
            <option value="all">全部状态</option>
            <option value="free">有空床</option>
            <option value="full">已满</option>
          </select>
        </div>
        <button id="reset" class="btn btn-outline-secondary btn-sm">重置</button>
      </div>
    </section>

    <ul id="dorm-list" class="list-group"></ul>
  </main>

  <footer class="text-center text-muted small py-3">宿舍信息中心 · 期末整合练习原型</footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/dorms.js"></script>
</body>
</html>

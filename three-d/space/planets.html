<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>星球宇宙（A-Frame版）</title>
  <script src="https://cdn.jsdelivr.net/npm/aframe@1.5.0/dist/aframe-master.min.js"></script>
</head>
<body>
  <a-scene>
    <!-- 环境：黑色太空 + 光源 -->
    <a-sky color="#000010"></a-sky>
    <a-light type="ambient" color="#ffffff" intensity="0.35"></a-light>
    <a-light type="point" position="0 1.6 -8" color="#ffffff" intensity="1.2"></a-light>

    <!-- 太阳：自转黄球 -->
    <a-sphere position="0 1.6 -8" radius="1.2" color="#ffcc33"
              animation="property: rotation; to: 0 360 0; dur: 12000; loop: true; easing: linear">
    </a-sphere>

    <!-- 地球公转组 -->
    <a-entity position="0 1.6 -8"
              animation="property: rotation; to: 0 360 0; dur: 10000; loop: true; easing: linear">
      <a-sphere position="4 0 0" radius="0.5" color="#2196f3"></a-sphere>
    </a-entity>

    <!-- 土星公转组：球体 + torus 圆环（不同 primitive） -->
    <a-entity position="0 1.6 -8"
              animation="property: rotation; to: 0 360 0; dur: 18000; loop: true; easing: linear">
      <a-sphere position="7.5 0 0" radius="0.7" color="#e0c08a">
        <a-entity geometry="primitive: torus; radius: 1.1; radiusTubular: 0.07"
                  material="color: #c9a86a" rotation="-90 20 0">
        </a-entity>
      </a-sphere>
    </a-entity>

    <!-- 相机初始位 -->
    <a-camera position="0 2.2 5"></a-camera>
  </a-scene>

  <!-- 星空：场景加载后撒 80 颗白色小球 -->
  <script>
    document.querySelector('a-scene').addEventListener('loaded', function () {
      for (let i = 0; i < 80; i++) {
        const s = document.createElement('a-sphere');
        const r = 35 + Math.random() * 25;
        const t = Math.random() * Math.PI * 2;
        const p = Math.acos(2 * Math.random() - 1);
        s.setAttribute('position', {
          x: r * Math.sin(p) * Math.cos(t),
          y: r * Math.cos(p),
          z: r * Math.sin(p) * Math.sin(t)
        });
        s.setAttribute('radius', 0.22);
        s.setAttribute('color', '#ffffff');
        this.appendChild(s);
      }
    });
  </script>
</body>
</html>

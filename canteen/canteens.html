<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>食堂查询 - 校园食堂信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="toast-container"></div>

  <section class="container py-4">
    <h2 class="mb-3">🔍 食堂查询</h2>
    <p class="text-muted">支持按区域筛选、按名称/标签关键词搜索，并按评分排序。</p>

    <!-- 筛选搜索栏 -->
    <div class="card stat-card p-3 mb-4">
      <div class="row g-2 align-items-center">
        <div class="col-12 col-md-5">
          <input type="text" id="search" class="form-control" placeholder="搜索食堂名称或标签…" />
        </div>
        <div class="col-6 col-md-3">
          <select id="area-filter" class="form-select">
            <option value="">全部区域</option>
            <option value="东区">东区</option>
            <option value="西区">西区</option>
          </select>
        </div>
        <div class="col-6 col-md-2">
          <select id="sort-filter" class="form-select">
            <option value="default">默认排序</option>
            <option value="rating-desc">评分高→低</option>
            <option value="rating-asc">评分低→高</option>
          </select>
        </div>
        <div class="col-12 col-md-2">
          <button id="reset" class="btn btn-outline-secondary w-100">重置</button>
        </div>
      </div>
    </div>

    <!-- 食堂卡片列表 -->
    <div class="row g-3" id="canteen-list">
      <div class="col-12 text-center text-muted py-5">数据加载中…</div>
    </div>

    <!-- 空结果提示 -->
    <div id="empty-tip" class="text-center text-muted py-4" style="display:none;">
      😴 没有匹配的食堂，试试调整筛选条件。
    </div>
  </section>

  <footer class="text-center text-muted py-3 border-top">
    <small>校园食堂信息中心 · 个人作业</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/canteens.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>菜品管理 - 校园食堂信息中心</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="toast-container"></div>

  <section class="container py-4">
    <h2 class="mb-3">📝 菜品管理</h2>
    <p class="text-muted">支持添加、修改、删除菜品（数据保存在浏览器 localStorage，可一键重置回初始数据）。</p>

    <!-- 操作栏 -->
    <div class="d-flex flex-wrap gap-2 mb-3">
      <button id="btn-add" class="btn btn-primary">+ 新增菜品</button>
      <button id="btn-reset" class="btn btn-outline-secondary">重置为初始数据</button>
      <div class="ms-auto d-flex align-items-center gap-2">
        <label class="form-label mb-0 text-muted"><small>按食堂筛选：</small></label>
        <select id="canteen-filter" class="form-select form-select-sm" style="width:auto;">
          <option value="">全部食堂</option>
        </select>
      </div>
    </div>

    <!-- 菜品表格 -->
    <div class="table-responsive">
      <table class="table table-bordered align-middle">
        <thead>
          <tr>
            <th>编号</th><th>菜品名称</th><th>所属食堂</th><th>类别</th>
            <th>价格(元)</th><th>热量(kcal)</th><th>评分</th><th>操作</th>
          </tr>
        </thead>
        <tbody id="dish-tbody">
          <tr><td colspan="8" class="text-center text-muted py-4">数据加载中…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- ECharts 两类图表 -->
    <h3 class="mt-5 mb-3">📊 数据可视化</h3>
    <div class="row g-3">
      <div class="col-lg-6">
        <div class="chart-box">
          <h5>各食堂菜品均价（柱状图）</h5>
          <div id="bar-chart" style="width:100%;height:300px;"></div>
        </div>
      </div>
      <div class="col-lg-6">
        <div class="chart-box">
          <h5>菜品类别占比（饼图）</h5>
          <div id="pie-chart" style="width:100%;height:300px;"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 新增/编辑模态框 -->
  <div class="modal fade" id="dish-modal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title">新增菜品</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <form id="dish-form">
            <input type="hidden" id="dish-id" />
            <div class="mb-3">
              <label class="form-label">菜品名称 <span class="text-danger">*</span></label>
              <input type="text" class="form-control" id="dish-name" required />
            </div>
            <div class="mb-3">
              <label class="form-label">所属食堂 <span class="text-danger">*</span></label>
              <select class="form-select" id="dish-canteen" required></select>
            </div>
            <div class="mb-3">
              <label class="form-label">类别 <span class="text-danger">*</span></label>
              <select class="form-select" id="dish-category" required>
                <option value="主食">主食</option>
                <option value="面食">面食</option>
                <option value="炒菜">炒菜</option>
                <option value="套餐">套餐</option>
                <option value="小吃">小吃</option>
              </select>
            </div>
            <div class="row">
              <div class="col-6 mb-3">
                <label class="form-label">价格(元) <span class="text-danger">*</span></label>
                <input type="number" class="form-control" id="dish-price" min="0" step="0.5" required />
              </div>
              <div class="col-6 mb-3">
                <label class="form-label">热量(kcal)</label>
                <input type="number" class="form-control" id="dish-calories" min="0" />
              </div>
            </div>
            <div class="mb-3">
              <label class="form-label">评分(0-5)</label>
              <input type="number" class="form-control" id="dish-rating" min="0" max="5" step="0.1" />
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
          <button type="button" class="btn btn-primary" id="btn-save">保存</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-muted py-3 border-top">
    <small>校园食堂信息中心 · 个人作业</small>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
  <script src="js/common.js"></script>
  <script src="js/dishes.js"></script>
</body>
</html>

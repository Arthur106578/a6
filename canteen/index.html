<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>校园食堂信息中心 - 首页</title>
  <!-- Bootstrap 5 CSS -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="nav-placeholder"></div>
  <div id="toast-container"></div>

  <!-- Hero 区 -->
  <section class="hero text-center">
    <div class="container">
      <h1>🍴 校园食堂信息中心</h1>
      <p class="lead mb-0">食堂查询 · 菜品管理 · 数据可视化 · 三维导览</p>
    </div>
  </section>

  <!-- 概览统计卡片 -->
  <section class="container py-4">
    <h3 class="mb-3">数据概览</h3>
    <div class="row g-3" id="stat-cards">
      <div class="col-6 col-md-3"><div class="card stat-card p-3 text-center"><h2 id="stat-canteens">--</h2><small>食堂数量</small></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card p-3 text-center"><h2 id="stat-dishes">--</h2><small>菜品总数</small></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card p-3 text-center"><h2 id="stat-avg">--</h2><small>菜品均价(元)</small></div></div>
      <div class="col-6 col-md-3"><div class="card stat-card p-3 text-center"><h2 id="stat-rating">--</h2><small>平均评分</small></div></div>
    </div>
  </section>

  <!-- 快捷入口 -->
  <section class="container pb-4">
    <h3 class="mb-3">快捷入口</h3>
    <div class="row g-3">
      <div class="col-md-4">
        <a class="card stat-card p-4 text-decoration-none text-center h-100 d-block" href="canteens.html">
          <h4 class="text-warning">🔍 食堂查询</h4>
          <p class="text-muted mb-0">按区域筛选、关键词搜索食堂</p>
        </a>
      </div>
      <div class="col-md-4">
        <a class="card stat-card p-4 text-decoration-none text-center h-100 d-block" href="dishes.html">
          <h4 class="text-success">📝 菜品管理</h4>
          <p class="text-muted mb-0">增删改菜品并查看统计图表</p>
        </a>
      </div>
      <div class="col-md-4">
        <a class="card stat-card p-4 text-decoration-none text-center h-100 d-block" href="#tour">
          <h4 class="text-primary">🏠 三维导览</h4>
          <p class="text-muted mb-0">A-Frame 食堂内部漫游</p>
        </a>
      </div>
    </div>
  </section>

  <!-- A-Frame 三维食堂导览区域 -->
  <section class="container pb-5" id="tour">
    <h3 class="mb-3">🏠 食堂三维导览（A-Frame）</h3>
    <p class="text-muted">使用鼠标拖动视角，键盘 W/A/S/D 漫游食堂内部。若加载失败会显示下方占位提示。</p>
    <div class="scene-wrapper" id="scene-wrapper">
      <a-scene embedded cursor="rayOrigin: mouse" loading-screen="enabled: false" wasd-controls>
        <a-sky color="#cce6ff"></a-sky>
        <a-light type="ambient" color="#fff" intensity="0.8"></a-light>
        <a-light type="directional" position="2 4 3" intensity="0.6"></a-light>

        <!-- 地面 -->
        <a-box position="0 0 -5" color="#8b5a2b" depth="14" width="14" height="0.2"></a-box>
        <!-- 墙体（四围）-->
        <a-box position="0 2.5 -12" color="#d9a066" depth="14" width="0.3" height="5"></a-box>
        <a-box position="0 2.5 2" color="#d9a066" depth="14" width="0.3" height="5"></a-box>
        <a-box position="-7 2.5 -5" color="#d9a066" depth="0.3" width="14" height="5"></a-box>
        <a-box position="7 2.5 -5" color="#d9a066" depth="0.3" width="14" height="5"></a-box>

        <!-- 取餐台 -->
        <a-box position="0 1 -9" color="#6b4226" depth="2" width="8" height="1"></a-box>
        <a-text value="取餐台" position="-1 2.2 -8.7" color="#fff" rotation="0 0 0"></a-text>

        <!-- 餐桌 + 椅子（三排）-->
        <a-box position="-3 0.7 -3" color="#f5deb3" depth="1.2" width="1.6" height="0.2"></a-box>
        <a-box position="-3 0.45 -2.2" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>
        <a-box position="-3 0.45 -3.8" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>

        <a-box position="0 0.7 -3" color="#f5deb3" depth="1.2" width="1.6" height="0.2"></a-box>
        <a-box position="0 0.45 -2.2" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>
        <a-box position="0 0.45 -3.8" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>

        <a-box position="3 0.7 -3" color="#f5deb3" depth="1.2" width="1.6" height="0.2"></a-box>
        <a-box position="3 0.45 -2.2" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>
        <a-box position="3 0.45 -3.8" color="#a0522d" depth="0.4" width="0.4" height="0.9"></a-box>

        <!-- 入口标识 -->
        <a-text value="食堂入口 →" position="5 1.6 1.5" color="#d9530b" rotation="0 180 0" width="6"></a-text>

        <!-- 摄像机：从入口处向内看 -->
        <a-camera position="0 1.6 1" wasd-controls="acceleration: 20"></a-camera>
      </a-scene>
      <div id="scene-fallback" class="text-center text-muted p-4" style="display:none;">
        ⚠️ A-Frame 三维场景加载失败，请检查网络或刷新页面重试。
      </div>
    </div>
  </section>

  <footer class="text-center text-muted py-3 border-top">
    <small>校园食堂信息中心 · 个人作业 · 仅用于课堂学习</small>
  </footer>

  <!-- 依赖脚本 -->
  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="js/common.js"></script>
  <script>
    // 首页逻辑
    $(function () {
      renderNav("home");

      // 加载失败兜底（A-Frame 加载超时检测）
      var sceneEl = document.querySelector("a-scene");
      if (sceneEl) {
        var timeout = setTimeout(function () {
          if (!sceneEl.hasLoaded) {
            $("#scene-fallback").show();
            $("a-scene").hide();
            showError("A-Frame 三维场景加载超时，已显示占位提示");
          }
        }, 8000);
        sceneEl.addEventListener("loaded", function () { clearTimeout(timeout); });
      }

      // 加载食堂数据用于概览
      loadJSON("data/canteens.json", function (canteens) {
        $("#stat-canteens").text(canteens.length);
        var avgRating = (canteens.reduce(function (s, c) { return s + c.rating; }, 0) / canteens.length).toFixed(2);
        $("#stat-rating").text(avgRating);
      });

      // 加载菜品数据用于概览
      loadJSON("data/dishes.json", function (dishes) {
        $("#stat-dishes").text(dishes.length);
        var avgPrice = (dishes.reduce(function (s, d) { return s + d.price; }, 0) / dishes.length).toFixed(1);
        $("#stat-avg").text(avgPrice);
      });
    });
  </script>
</body>
</html>
